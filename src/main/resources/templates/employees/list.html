<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Employees')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Employees Directory</h1>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Phone</th>
                        <th>Date of Joining</th>
                        <th>Salary (&#8377;)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${employees}">
                        <td><strong th:text="${e.employeeCode}"></strong></td>
                        <td th:text="${e.name}"></td>
                        <td><span class="badge badge-info" th:text="${e.designation}"></span></td>
                        <td th:text="${e.phoneNo}"></td>
                        <td th:text="${e.dateOfJoining}"></td>
                        <td th:text="${#numbers.formatDecimal(e.salary, 1, 2)}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="6" style="text-align: center; color: #64748b; padding: 25px;">No employees found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:replace="~{layout :: pagination('/employees', ${currentPage}, ${totalPages}, ${totalRecords}, ${pageSize})}"></div>
    </div>
</body>
</html>
