<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Employees')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Employees</h1>
        <table>
            <tr><th>Code</th><th>Name</th><th>Designation</th><th>Phone</th><th>Date of Joining</th><th>Salary</th></tr>
            <tr th:each="e : ${employees}">
                <td th:text="${e.employeeCode}"></td>
                <td th:text="${e.name}"></td>
                <td th:text="${e.designation}"></td>
                <td th:text="${e.phoneNo}"></td>
                <td th:text="${e.dateOfJoining}"></td>
                <td th:text="${e.salary}"></td>
            </tr>
        </table>
    </div>
</body>
</html>
