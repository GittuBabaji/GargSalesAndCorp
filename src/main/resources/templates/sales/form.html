<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('New Sale')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>New Sale Bill</h1>
        <form action="/sales" method="post" id="saleForm">
            <div>
                <label>Bill No:</label>
                <input type="text" name="billNo" required maxlength="15"/>
            </div>
            <div>
                <label>Bill Date:</label>
                <input type="date" name="billDate" required/>
            </div>
            <div>
                <label>Client:</label>
                <select name="clientCode" required>
                    <option value="">-- Select Client --</option>
                    <option th:each="c : ${clients}" th:value="${c.clientCode}" th:text="${c.clientCode + ' - ' + c.name}"></option>
                </select>
            </div>
            <div>
                <label>Payment Mode:</label>
                <select name="paymentMode">
                    <option value="Cash">Cash</option>
                    <option value="Credit">Credit</option>
                </select>
            </div>
            <div>
                <label>Period ID:</label>
                <select name="periodId">
                    <option value="">-- No Period / None --</option>
                    <option th:each="p : ${summaries}" th:value="${p.periodId}" th:text="${p.periodId + ' - ' + p.period}"></option>
                </select>
            </div>

            <hr/>
            <h3>Bill Items</h3>
            <div id="itemsContainer">
                <div class="item-row">
                    <label>Item:</label>
                    <select name="itemCode">
                        <option value="">-- Select --</option>
                        <option th:each="i : ${items}" th:value="${i.itemCode}"
                                th:text="${i.itemCode + ' - ' + i.itemName + ' (Qty: ' + i.quantity + ', Price: ' + i.sellingPrice + ')'}"></option>
                    </select>
                    <label>Qty:</label>
                    <input type="number" name="quantitySold" value="1" min="1" style="width:80px;"/>
                    <label>Rate:</label>
                    <input type="number" step="0.01" name="rateApplied" min="0" style="width:100px;"/>
                </div>
            </div>
            <button type="button" class="btn" onclick="addSaleItem()">+ Add Another Item</button>

            <div class="form-actions" style="margin-top:20px;">
                <button type="submit" class="btn btn-success">Submit Sale</button>
                <a href="/sales" class="btn">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function addSaleItem() {
        var container = document.getElementById('itemsContainer');
        var firstRow = container.querySelector('.item-row');
        var newRow = firstRow.cloneNode(true);
        var inputs = newRow.querySelectorAll('input');
        inputs.forEach(function(input) { input.value = input.type === 'number' ? (input.name === 'quantitySold' ? '1' : '') : ''; });
        var selects = newRow.querySelectorAll('select');
        selects.forEach(function(select) { select.selectedIndex = 0; });
        container.appendChild(newRow);
    }
    </script>
</body>
</html>
