<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sales')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Sales History <a href="/sales/new" class="btn btn-success">+ New Sale</a></h1>
        <table>
            <tr><th>Bill No</th><th>Date</th><th>Client</th><th>Total Amount</th><th>Payment Mode</th><th>Balance Due</th><th>Actions</th></tr>
            <tr th:each="s : ${sales}">
                <td th:text="${s.billNo}"></td>
                <td th:text="${s.billDate}"></td>
                <td th:text="${s.clientCode}"></td>
                <td th:text="${s.totalAmount}"></td>
                <td th:text="${s.paymentMode}"></td>
                <td th:text="${s.balanceDue}"></td>
                <td><a th:href="@{/sales/{id}(id=${s.billNo})}" class="btn">View</a></td>
            </tr>
        </table>
    </div>
</body>
</html>
