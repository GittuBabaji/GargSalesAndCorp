<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('New Purchase')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>New Purchase Bill</h1>
        <form action="/purchases" method="post">
            <div>
                <label>Bill No:</label>
                <input type="text" name="purchaseBillNo" required maxlength="15"/>
            </div>
            <div>
                <label>Bill Date:</label>
                <input type="date" name="billDate" required/>
            </div>
            <div>
                <label>Supplier:</label>
                <select name="supplierCode" required>
                    <option value="">-- Select Supplier --</option>
                    <option th:each="s : ${suppliers}" th:value="${s.supplierCode}" th:text="${s.supplierCode + ' - ' + s.name}"></option>
                </select>
            </div>
            <div>
                <label>Amount Paid:</label>
                <input type="number" step="0.01" name="amountPaid" value="0" min="0"/>
            </div>
            <div>
                <label>Period ID:</label>
                <select name="periodId">
                    <option value="">-- No Period / None --</option>
                    <option th:each="p : ${summaries}" th:value="${p.periodId}" th:text="${p.periodId + ' - ' + p.period}"></option>
                </select>
            </div>

            <hr/>
            <h3>Purchase Items</h3>
            <div id="itemsContainer">
                <div class="item-row">
                    <label>Item:</label>
                    <select name="itemCode">
                        <option value="">-- Select --</option>
                        <option th:each="i : ${items}" th:value="${i.itemCode}" th:text="${i.itemCode + ' - ' + i.itemName}"></option>
                    </select>
                    <label>Qty:</label>
                    <input type="number" name="quantity" value="1" min="1" style="width:80px;"/>
                    <label>Rate:</label>
                    <input type="number" step="0.01" name="rate" min="0" style="width:100px;"/>
                </div>
            </div>
            <button type="button" class="btn" onclick="addPurchaseItem()">+ Add Another Item</button>

            <div class="form-actions" style="margin-top:20px;">
                <button type="submit" class="btn btn-success">Submit Purchase</button>
                <a href="/purchases" class="btn">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function addPurchaseItem() {
        var container = document.getElementById('itemsContainer');
        var firstRow = container.querySelector('.item-row');
        var newRow = firstRow.cloneNode(true);
        var inputs = newRow.querySelectorAll('input');
        inputs.forEach(function(input) { input.value = input.type === 'number' ? (input.name === 'quantity' ? '1' : '') : ''; });
        var selects = newRow.querySelectorAll('select');
        selects.forEach(function(select) { select.selectedIndex = 0; });
        container.appendChild(newRow);
    }
    </script>
</body>
</html>
