<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Purchases')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>
            <span>Purchase History</span>
            <a href="/purchases/new" class="btn btn-success">+ New Purchase</a>
        </h1>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Bill No</th>
                        <th>Date</th>
                        <th>Supplier</th>
                        <th>Total Amount (&#8377;)</th>
                        <th>Amount Paid (&#8377;)</th>
                        <th>Balance Due (&#8377;)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${purchases}">
                        <td><strong th:text="${p.purchaseBillNo}"></strong></td>
                        <td th:text="${p.billDate}"></td>
                        <td>
                            <a th:href="@{/suppliers/view/{id}(id=${p.supplierCode})}" th:text="${p.supplierCode}" style="color: #3b82f6; font-weight: 500;"></a>
                        </td>
                        <td th:text="${#numbers.formatDecimal(p.totalAmount, 1, 2)}"></td>
                        <td style="color: #059669;" th:text="${#numbers.formatDecimal(p.amountPaid, 1, 2)}"></td>
                        <td>
                            <span th:class="${p.balanceDue > 0 ? 'badge badge-danger' : 'badge badge-success'}"
                                  th:text="${#numbers.formatDecimal(p.balanceDue, 1, 2)}"></span>
                        </td>
                        <td>
                            <a th:href="@{/purchases/{id}(id=${p.purchaseBillNo})}" class="btn btn-sm btn-info">View</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchases)}">
                        <td colspan="7" style="text-align: center; color: #64748b; padding: 25px;">No purchases found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:replace="~{layout :: pagination('/purchases', ${currentPage}, ${totalPages}, ${totalRecords}, ${pageSize})}"></div>
    </div>
</body>
</html>
