<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Client Form')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1 th:text="${client.clientCode == null or client.clientCode == ''} ? 'Add New Client' : 'Edit Client'">Client Form</h1>
        <form th:action="${client.clientCode == null or client.clientCode == ''} ? '/clients' : '/clients/update/' + ${client.clientCode}" method="post">
            <div th:if="${client.clientCode == null or client.clientCode == ''}">
                <label>Client Code:</label>
                <input type="text" name="clientCode" required maxlength="10"/>
            </div>
            <div>
                <label>Name:</label>
                <input type="text" name="name" th:value="${client.name}" required maxlength="100"/>
            </div>
            <div>
                <label>Address:</label>
                <input type="text" name="address" th:value="${client.address}" maxlength="255"/>
            </div>
            <div>
                <label>Locality:</label>
                <input type="text" name="locality" th:value="${client.locality}" maxlength="100"/>
            </div>
            <div>
                <label>Phone:</label>
                <input type="text" name="phoneNo" th:value="${client.phoneNo}" maxlength="15"/>
            </div>
            <div>
                <label>GST No:</label>
                <input type="text" name="gstNo" th:value="${client.gstNo}" maxlength="20"/>
            </div>
            <div>
                <label>DR Balance:</label>
                <input type="number" step="0.01" name="drBalance" th:value="${client.drBalance}" min="0"/>
            </div>
            <div>
                <label>CR Balance:</label>
                <input type="number" step="0.01" name="crBalance" th:value="${client.crBalance}" min="0"/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="/clients" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
