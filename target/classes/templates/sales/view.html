<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('View Sale')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Sale Bill: <span th:text="${sale.billNo}"></span></h1>
        <div class="card-container">
            <div class="card"><h3>Date</h3><div class="value" th:text="${sale.billDate}"></div></div>
            <div class="card"><h3>Client</h3><div class="value" th:text="${sale.clientCode}"></div></div>
            <div class="card"><h3>Total Amount</h3><div class="value" th:text="${sale.totalAmount}"></div></div>
            <div class="card"><h3>Payment Mode</h3><div class="value" th:text="${sale.paymentMode}"></div></div>
            <div class="card"><h3>Balance Due</h3><div class="value" th:text="${sale.balanceDue}"></div></div>
        </div>
        <h2>Line Items</h2>
        <table>
            <tr><th>Item Code</th><th>Quantity Sold</th><th>Rate Applied</th><th>Amount</th></tr>
            <tr th:each="item : ${sale.items}">
                <td th:text="${item.itemCode}"></td>
                <td th:text="${item.quantitySold}"></td>
                <td th:text="${item.rateApplied}"></td>
                <td th:text="${item.amount}"></td>
            </tr>
        </table>
        <a href="/sales" class="btn">Back to Sales</a>
    </div>
</body>
</html>
