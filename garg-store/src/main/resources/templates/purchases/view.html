<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('View Purchase')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Purchase Bill: <span th:text="${purchase.purchaseBillNo}"></span></h1>
        <div class="card-container">
            <div class="card"><h3>Date</h3><div class="value" th:text="${purchase.billDate}"></div></div>
            <div class="card"><h3>Supplier</h3><div class="value" th:text="${purchase.supplierCode}"></div></div>
            <div class="card"><h3>Total Amount</h3><div class="value" th:text="${purchase.totalAmount}"></div></div>
            <div class="card"><h3>Amount Paid</h3><div class="value" th:text="${purchase.amountPaid}"></div></div>
            <div class="card"><h3>Balance Due</h3><div class="value" th:text="${purchase.balanceDue}"></div></div>
        </div>
        <h2>Line Items</h2>
        <table>
            <tr><th>Item Code</th><th>Quantity</th><th>Rate</th><th>Amount</th></tr>
            <tr th:each="item : ${purchase.items}">
                <td th:text="${item.itemCode}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.rate}"></td>
                <td th:text="${item.amount}"></td>
            </tr>
        </table>
        <a href="/purchases" class="btn">Back to Purchases</a>
    </div>
</body>
</html>
