<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Stock Item Form')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1 th:text="${item.itemCode == null or item.itemCode == ''} ? 'Add Stock Item' : 'Edit Stock Item'">Item Form</h1>
        <form th:action="${item.itemCode == null or item.itemCode == ''} ? '/inventory' : '/inventory/update/' + ${item.itemCode}" method="post">
            <div th:if="${item.itemCode == null or item.itemCode == ''}">
                <label>Item Code:</label><input type="text" name="itemCode" required maxlength="10"/>
            </div>
            <div><label>Item Name:</label><input type="text" name="itemName" th:value="${item.itemName}" required maxlength="100"/></div>
            <div><label>Category:</label><input type="text" name="category" th:value="${item.category}" maxlength="50"/></div>
            <div><label>Unit:</label><input type="text" name="unit" th:value="${item.unit}" maxlength="15"/></div>
            <div><label>Quantity:</label><input type="number" name="quantity" th:value="${item.quantity}" min="0" required/></div>
            <div><label>Cost Price:</label><input type="number" step="0.01" name="costPrice" th:value="${item.costPrice}" min="0" required/></div>
            <div><label>Selling Price:</label><input type="number" step="0.01" name="sellingPrice" th:value="${item.sellingPrice}" min="0" required/></div>
            <div><label>Reorder Level:</label><input type="number" name="reorderLevel" th:value="${item.reorderLevel}" min="0"/></div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="/inventory" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
