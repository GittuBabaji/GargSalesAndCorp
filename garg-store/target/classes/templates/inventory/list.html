<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Inventory')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Inventory <a href="/inventory/new" class="btn btn-success">+ Add Item</a></h1>
        <table>
            <tr>
                <th>Code</th><th>Name</th><th>Category</th><th>Unit</th>
                <th>Quantity</th><th>Cost Price</th><th>Selling Price</th><th>Reorder Level</th><th>Status</th><th>Actions</th>
            </tr>
            <tr th:each="i : ${items}">
                <td th:text="${i.itemCode}"></td>
                <td th:text="${i.itemName}"></td>
                <td th:text="${i.category}"></td>
                <td th:text="${i.unit}"></td>
                <td th:text="${i.quantity}"></td>
                <td th:text="${i.costPrice}"></td>
                <td th:text="${i.sellingPrice}"></td>
                <td th:text="${i.reorderLevel}"></td>
                <td>
                    <span th:if="${i.quantity <= i.reorderLevel}" class="low-stock">LOW STOCK</span>
                    <span th:unless="${i.quantity <= i.reorderLevel}" style="color:green;">OK</span>
                </td>
                <td>
                    <a th:href="@{/inventory/edit/{id}(id=${i.itemCode})}" class="btn">Edit</a>
                    <form th:action="@{/inventory/delete/{id}(id=${i.itemCode})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this item?');">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
