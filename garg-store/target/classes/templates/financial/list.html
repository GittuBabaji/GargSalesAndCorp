<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Financial Summary')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Financial Summary</h1>
        <table>
            <tr>
                <th>Period ID</th><th>Period</th><th>Total Assets</th><th>Total Liabilities</th>
                <th>Operating Cost</th><th>Gross Profit</th><th>Net Profit</th><th>Tax</th>
            </tr>
            <tr th:each="f : ${summaries}">
                <td th:text="${f.periodId}"></td>
                <td th:text="${f.period}"></td>
                <td th:text="${f.totalAssets}"></td>
                <td th:text="${f.totalLiabilities}"></td>
                <td th:text="${f.operatingCost}"></td>
                <td th:text="${f.grossProfit}"></td>
                <td th:text="${f.netProfit}"></td>
                <td th:text="${f.tax}"></td>
            </tr>
        </table>
    </div>
</body>
</html>
