<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Purchases')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Purchase History <a href="/purchases/new" class="btn btn-success">+ New Purchase</a></h1>
        <table>
            <tr><th>Bill No</th><th>Date</th><th>Supplier</th><th>Total Amount</th><th>Amount Paid</th><th>Balance Due</th><th>Actions</th></tr>
            <tr th:each="p : ${purchases}">
                <td th:text="${p.purchaseBillNo}"></td>
                <td th:text="${p.billDate}"></td>
                <td th:text="${p.supplierCode}"></td>
                <td th:text="${p.totalAmount}"></td>
                <td th:text="${p.amountPaid}"></td>
                <td th:text="${p.balanceDue}"></td>
                <td><a th:href="@{/purchases/{id}(id=${p.purchaseBillNo})}" class="btn">View</a></td>
            </tr>
        </table>
    </div>
</body>
</html>
