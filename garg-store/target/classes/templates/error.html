<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Error')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="content">
        <h1>Error</h1>
        <p class="alert" th:text="${error != null} ? ${error} : 'An unexpected error occurred.'">An error occurred.</p>
        <p th:if="${message != null}" th:text="${message}"></p>
        <a href="/" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
